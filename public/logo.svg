<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Camera Shutter button (red) -->
  <rect x="42" y="30" width="24" height="11" rx="5" fill="#ef4444" />

  <!-- Camera chassis -->
  <rect x="22" y="44" width="136" height="102" rx="25" stroke="#191827" stroke-width="10" />

  <!-- Viewfinder dot -->
  <circle cx="130" cy="65" r="6" fill="#191827" />

  <!-- Outer camera lens ring -->
  <circle cx="90" cy="95" r="28" stroke="#191827" stroke-width="10" />

  <!-- Inner camera lens core -->
  <circle cx="90" cy="95" r="14" fill="#191827" />

  <!-- Lens reflection highlight -->
  <circle cx="96" cy="89" r="4" fill="#ffffff" opacity="0.7" />
</svg>
